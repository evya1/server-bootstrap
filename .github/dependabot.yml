# Pinning an action to a commit SHA freezes what runs; without an update
# channel it also freezes the security fixes. Dependabot understands a SHA pin
# with a trailing version comment and updates both together, as a reviewable
# diff rather than a tag someone else moved.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
