# Throwaway release-candidate validation for #61: each documented install block
# (README full, README foundation-only, ML-PROFILE one-command), exactly as the
# candidate archive ships it, in a fresh stock ubuntu:24.04 container on
# GitHub-hosted x86-64 and ARM64 runners with no GPU; then the installed stack,
# an identical repeat, and the stack again. The candidate is named in
# validation/candidate.env. Lives only on its validation branch; never merged.
name: rc-validation

on:
  push:
    branches: [validation/v2.3.0-rc]

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    name: ${{ matrix.runner }} / ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        scenario: [full, minimal, ml]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load the candidate
        run: grep -E '^[A-Z_]+=[0-9a-f]*$' validation/candidate.env | tee -a "$GITHUB_ENV"

      # The foundation-only plan's acceptance check wants 50 GB free.
      - name: Free runner disk for the container
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/lib/jvm /opt/microsoft \
            /opt/google /usr/local/lib/node_modules /usr/local/share/chromium
          docker image prune --all --force > /dev/null
          df -h /

      - name: Download the CI test candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$CANDIDATE_RUN" -R "$GITHUB_REPOSITORY" \
            -n "server-bootstrap-test-candidate-$SB_CAND_SHA" -D candidate
          echo "SHA256SUMS: $(sha256sum candidate/SHA256SUMS)"
          cp validation/sb-candidate-test.sh candidate/
          ls -l candidate

      - name: Clean-host gate, install, stack checks, repeat in ubuntu:24.04
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          docker pull ubuntu:24.04
          docker image inspect ubuntu:24.04 --format 'image {{.Id}} {{.Os}}/{{.Architecture}} {{index .RepoDigests 0}}'
          docker run --rm -e SB_CAND_SHA -e SB_CAND_SUMS_SHA -e SB_PUBLIC_TGZ_SHA -e SCENARIO \
            -v "$PWD/candidate:/root/sb-candidate" ubuntu:24.04 \
            bash -c 'bash /root/sb-candidate/sb-candidate-test.sh --check --scenario "$SCENARIO" && bash /root/sb-candidate/sb-candidate-test.sh --scenario "$SCENARIO"'

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rc-logs-${{ matrix.runner }}-${{ matrix.scenario }}-${{ github.sha }}
          path: candidate/logs
          retention-days: 14
          if-no-files-found: warn
