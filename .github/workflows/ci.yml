name: ci
on: [push, pull_request]
# TEMPORARY probe for #41: this comment changes a tracked workflow file
# without regenerating checksums/SHA256SUMS, which is the exact shape every
# Dependabot pull request arrives in. Reverted in the next commit.
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history is intentional: SECURITY-PREVENTION-01.9 forbids rewriting
      # history, so a credential in an older commit stays reachable and has to be
      # caught here rather than deleted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # tools/gitleaks.sh holds the only version and checksum pin in the repo;
      # the release build and release workflow scan through the same script. It
      # caches the verified binary under a per-version path in the runner's temp
      # dir, so later steps reuse it. Do not set that path from a job-level env:
      # the runner context is not available there and the workflow fails to
      # compile.
      - name: Install and verify the pinned Gitleaks
        run: |
          set -Eeuo pipefail
          echo "pinned version: $(bash tools/gitleaks.sh version)"
          echo "verified binary: $(bash tools/gitleaks.sh path)"
      # Asserts the checkout is non-shallow and prints the commit count before
      # scanning every commit on every ref. Fails closed on any finding.
      - name: Scan complete Git history
        run: bash tools/gitleaks.sh scan-history
      # Proves the command above really does catch a secret that exists only in
      # an older reachable commit, using a throwaway repository in RUNNER_TEMP.
      - name: Verify full-history detection catches an older commit
        run: bash tools/verify-history-scan.sh

  shell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Tags are needed so the suite's history-preservation check verifies the
      # published release tags still resolve instead of skipping.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck (advisory)
        run: shellcheck -S warning $(find . -name '*.sh' -not -path './release/dist/*') server-bundle-install server-vscode-extensions server-secrets || true
      # A YAML-aware linter for the workflow files themselves, pinned and
      # checksum-verified through tools/actionlint.sh the same way the scanner
      # is. Blocking, unlike shellcheck: a workflow that does not parse or names
      # a context that does not exist is a build that fails at the wrong moment.
      - name: actionlint
        run: bash tools/actionlint.sh run
      - name: test suite
        env:
          # This job checks out with fetch-depth: 0, so it has every tag and can
          # assert the published ones still resolve. Other checkouts skip it.
          SB_CHECK_PUBLISHED_TAGS: 1
        run: bash tests/run-tests.sh
      # Runs only after something above has already failed, and always exits 0,
      # so it cannot turn a red run green or become a gate of its own. When the
      # failure is a stale checksums/SHA256SUMS -- the shape every Dependabot
      # pull request arrives in, because it edits a tracked workflow file and
      # cannot run this repository's regeneration command -- it prints the one
      # fixing command and the exact patch that command produces. Read-only: it
      # restores the manifest before returning and never commits or pushes. The
      # job keeps contents: read. See #41.
      - name: Explain a stale manifest, if that is what failed
        if: failure()
        run: bash tools/manifest-fix-hint.sh

  release-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The same script release.yml runs, minus the tag: the pinned Gitleaks,
      # the reproducible double build, and the pre-upload artifact scan. Running
      # it here is what makes "release.yml has no code path CI does not run" a
      # structural fact rather than something a test tries to prove by reading
      # YAML text.
      - name: Release preflight
        run: bash tools/release-preflight.sh

  tag-checkout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # release.yml is triggered by a tag push, so actions/checkout hands it a
      # detached, depth-1 checkout carrying exactly one tag. ci.yml gets that
      # shape too -- but only on the tag push itself, which is after the version
      # number has been spent, and SECURITY.md forbids reusing it. That is how
      # PASS: 233 FAIL: 4 reached the v2.2.1 release instead of a pull request:
      # ci.yml's release-build job failed with it three seconds before the
      # release job did, and both were too late. This job manufactures the shape
      # on every branch push and pull request.
      #
      # What it is: a rehearsal of the Git metadata a tag build sees -- detached
      # HEAD, one commit, one tag, a shallow clone. That is the part that broke.
      #
      # What it is not: a tag event. It does not reproduce GITHUB_REF_TYPE=tag,
      # the tag event payload, the GitHub expression context release.yml reads
      # github.ref_name from, the origin URL, the fetch refspec, or the
      # checkout's authentication state. Anything depending on those is still
      # first exercised by a real tag push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A local tag plus a shallow single-branch clone of it reproduces all
      # three properties of a tag build: detached HEAD, one commit, one tag.
      # Annotated, because every published tag here is annotated; -c keeps the
      # tagger identity local to the command. The tag never leaves the runner.
      - name: Build a tag-shaped checkout
        run: |
          set -Eeuo pipefail
          git -c user.name=ci -c user.email=ci@localhost \
              tag -a v0.0.0-tagshape -m "tag-shaped checkout probe"
          git clone --quiet --depth 1 --branch v0.0.0-tagshape \
              "file://$GITHUB_WORKSPACE" "$RUNNER_TEMP/tag-shape"
          cd "$RUNNER_TEMP/tag-shape"
          # A commit that already carries a release tag hands the clone that tag
          # as well; drop it so the shape is identical on every run.
          mapfile -t extra < <(git tag -l | grep -vFx v0.0.0-tagshape || true)
          (( ${#extra[@]} == 0 )) || git tag -d "${extra[@]}"
          # Assert the shape rather than printing it. A clone that quietly came
          # out full, or on a branch, or carrying more than the probe tag, would
          # still run the suite green and this job would prove nothing.
          head_ref="$(git rev-parse --abbrev-ref HEAD)"
          commits="$(git rev-list --count HEAD)"
          tags="$(git tag -l | tr '\n' ' ')"
          printf 'HEAD: %s (%s)   commits: %s   tags: %s\n' \
              "$(git rev-parse --short HEAD)" "$head_ref" "$commits" "$tags"
          [[ "$head_ref" == HEAD ]] || { echo "not a detached checkout: $head_ref" >&2; exit 1; }
          [[ "$commits" == 1 ]] || { echo "not depth-1: $commits commits" >&2; exit 1; }
          [[ "$tags" == "v0.0.0-tagshape " ]] || { echo "not a single-tag checkout: $tags" >&2; exit 1; }
          [[ -f .git/shallow ]] || { echo "clone is not shallow" >&2; exit 1; }
      # The whole release sequence, inside that shape, with the tag the next
      # release would carry. SB_CHECK_PUBLISHED_TAGS is deliberately not set:
      # release.yml does not set it either, and the point is to prove the suite
      # passes where it is absent.
      - name: Release preflight under the tag-shaped checkout
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/tag-shape"
          bash tools/release-preflight.sh --tag "v$(tr -d '[:space:]' < VERSION)"
