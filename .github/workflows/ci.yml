name: ci
on: [push, pull_request]
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history is intentional: SECURITY-PREVENTION-01.9 forbids rewriting
      # history, so a credential in an older commit stays reachable and has to be
      # caught here rather than deleted.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # tools/gitleaks.sh holds the only version and checksum pin in the repo;
      # the release build and release workflow scan through the same script. It
      # caches the verified binary under a per-version path in the runner's temp
      # dir, so later steps reuse it. Do not set that path from a job-level env:
      # the runner context is not available there and the workflow fails to
      # compile.
      - name: Install and verify the pinned Gitleaks
        run: |
          set -Eeuo pipefail
          echo "pinned version: $(bash tools/gitleaks.sh version)"
          echo "verified binary: $(bash tools/gitleaks.sh path)"
      # Asserts the checkout is non-shallow and prints the commit count before
      # scanning every commit on every ref. Fails closed on any finding.
      - name: Scan complete Git history
        run: bash tools/gitleaks.sh scan-history
      # Proves the command above really does catch a secret that exists only in
      # an older reachable commit, using a throwaway repository in RUNNER_TEMP.
      - name: Verify full-history detection catches an older commit
        run: bash tools/verify-history-scan.sh

  shell:
    runs-on: ubuntu-latest
    steps:
      # Tags are needed so the suite's history-preservation check verifies the
      # published release tags still resolve instead of skipping.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck (advisory)
        run: shellcheck -S warning $(find . -name '*.sh' -not -path './release/dist/*') server-bundle-install server-vscode-extensions server-secrets || true
      - name: test suite
        run: bash tests/run-tests.sh

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Resolved once and exported, so the release scans and the suite's
      # functional scan checks reuse one verified binary instead of downloading
      # per scan or skipping.
      - name: Install and verify the pinned Gitleaks
        run: echo "GITLEAKS_BIN=$(bash tools/gitleaks.sh path)" >> "$GITHUB_ENV"
      # Proves the archives are byte-reproducible on a clean machine, not just
      # on the author's box. build-release.sh builds twice and fails on a diff,
      # then scans the staging trees and every extracted archive.
      - run: bash release/build-release.sh
