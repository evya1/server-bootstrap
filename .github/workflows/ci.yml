name: ci
on: [push, pull_request]
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history is intentional: the scan must cover preserved commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install and verify Gitleaks v8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan complete Git history with Gitleaks
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/gitleaks" detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts='--all' \
            --redact \
            --exit-code 1 \
            --no-banner

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck (advisory)
        run: shellcheck -S warning $(find . -name '*.sh' -not -path './release/dist/*') server-bundle-install server-vscode-extensions || true
      - name: test suite
        run: bash tests/run-tests.sh

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Proves the archives are byte-reproducible on a clean machine, not just
      # on the author's box. build-release.sh builds twice and fails on a diff.
      - run: bash release/build-release.sh
