name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every pre-publication gate lives in tools/release-preflight.sh: the tag
      # check, the pinned Gitleaks, the reproducible build (which runs the suite
      # and builds twice), and the artifact scan that runs immediately before
      # upload. ci.yml runs the same script on every push and pull request, once
      # in an ordinary checkout and once inside a manufactured tag-shaped one.
      #
      # Adding a step here rather than to that script is how a release-only code
      # path gets introduced -- the failure mode that put PASS: 233 FAIL: 4 into
      # the v2.2.1 release. tests/run-tests.sh asserts that this job invokes
      # exactly one repository script, so growing a second one fails CI.
      #
      # GITHUB_REF_NAME arrives through the environment rather than a ${{ }}
      # expression, so a tag name is data to the shell, never text spliced into
      # the script before it runs.
      - name: Release preflight
        env:
          CANDIDATE_TAG: ${{ github.ref_name }}
        run: bash tools/release-preflight.sh --tag "$CANDIDATE_TAG"

      - name: Publish assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/dist/server-bootstrap-*.tar.gz
            release/dist/server-bootstrap-*.tar.gz.sha256
            release/dist/server-bootstrap-*.zip
            release/dist/server-bootstrap-*.zip.sha256
            release/dist/server-bootstrap-*-release-manifest.json
            release/dist/server-provision.sh
            release/dist/provision-plan.example.sh
            release/dist/provision-plan.whisper.example.sh
