name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(tr -d '[:space:]' < VERSION)"
          [[ "$tag" == "$declared" ]] \
            || { echo "ERROR: tag $tag != VERSION $declared" >&2; exit 1; }

      - name: Install and verify the pinned Gitleaks
        run: echo "GITLEAKS_BIN=$(bash tools/gitleaks.sh path)" >> "$GITHUB_ENV"

      # Runs the full test suite, refreshes checksums, builds every archive
      # twice failing if the two passes are not byte-identical, and scans the
      # source staging tree and every extracted archive.
      - name: Build release
        run: bash release/build-release.sh

      # The gate immediately before upload, deliberately independent of the
      # build: it re-scans release/dist as it will be published, descending into
      # the archives, and honours no skip switch. If this step fails the job
      # fails and Publish assets never runs, so nothing is uploaded.
      - name: Scan release artifacts before publication
        run: bash tools/gitleaks.sh scan-artifacts release/dist "release artifacts"

      - name: Publish assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/dist/server-bootstrap-*.tar.gz
            release/dist/server-bootstrap-*.tar.gz.sha256
            release/dist/server-bootstrap-*.zip
            release/dist/server-bootstrap-*.zip.sha256
            release/dist/server-bootstrap-*-release-manifest.json
            release/dist/server-provision.sh
            release/dist/provision-plan.example.sh
            release/dist/provision-plan.whisper.example.sh
